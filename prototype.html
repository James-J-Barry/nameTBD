  FIRSTMARK — clickable scope/behaviour prototype for a provenance-first game discovery site.

  File layout (edit by hand):
    1. MOCK DATA     <script id="mock-data">   — settings defaults, games, similarity pairs, claims, appeals,
                                                 scripted moderator decisions, expected statuses per test case.

    3. UI            <script type="text/babel">  — React views (store, game page, registration, claims,
                                                 moderation, settings, simulation, tests).

  Everything is mocked. No network calls except loading React / Babel / Tailwind from CDNs.
-->

  Conventions
  - Dates are 'YYYY-MM-DD' strings. The simulation runs from simulation.start to simulation.end.
  - A game "enters the system" on the earlier of its Steam page date (auto-import) or its registration date.
  - reviews:    number, or [[date, count], ...] (linearly interpolated, 0 before the first point).
  - copySignal: number, or [[date, score], ...] (step function). Share of reviews that claim the game
                reproduces a SPECIFIC other game. Genre comparisons ("like Hades") are tracked separately
                in genreSignal and never count.
  - namesOriginal: copy-signal reviews on THIS game's page that name another game as the original.
  - ai: only list categories that are not 'none'. Levels: 'assisted' (human-edited) | 'generated'.
  - truth: ground truth for the test panel only, never shown publicly.
           'original' | 'non-original' | 'parallel' | 'idea-overlap' | 'n/a'.
           A 'non-original' that ends up LISTED or VERIFIED is flagged as a worst-case error.
  - expected: [[fromDate, STATUS], ...] step function. Before the first entry the game is expected
              to be unknown to the system (null). Statuses: LISTED, VERIFIED, NOT_YET_ELIGIBLE, HELD,
              QUEUED, REJECTED, ATTACHED (DLC attached to its parent; see ambiguity notes).
  - All names, studios, people, and URLs are fictional. Links use *.example domains or fake app ids.
-->

<!-- ======================================================================================
     2. RULES ENGINE  (pure functions — no DOM, no React)
     ======================================================================================
  Order of evaluation for each game at simulated date D:
    0. Not yet known to the system (no Steam page, no registration)      → null
    1. Non-accusatory automatic outcomes: DLC → ATTACHED; soundtrack/tool, removed/takedown,
       content policy, duplicate                                          → REJECTED
    2. Prior moderator rejection: open appeal WITH new evidence           → QUEUED (appeal)
                                  otherwise                               → REJECTED
    3. Registration approved by a moderator                               → VERIFIED
    4. Stakeholder waiting (registration, asset/code match against a registered build,
       claim meeting the evidence bar, appeal)                            → QUEUED (priority = max trigger)
    5. Fact checks: copy-signal / named-as-original / similarity collision → HELD
                    only release-age / review-count failing               → NOT_YET_ELIGIBLE
                    everything passes                                     → LISTED
  Similarity collisions only count against partners in the reference set R:
    R = games with a pending/approved registration, VERIFIED games, and games that would be
        LISTED on every check except collisions. (Avoids status A depending on status B and back.)
-->
<script id="rules-engine">
const Engine = (() => {
  const DAY = 86400000;
  const toMs = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
  const daysBetween = (a, b) => Math.round((toMs(b) - toMs(a)) / DAY);
  const addDays = (d, n) => new Date(toMs(d) + n * DAY).toISOString().slice(0, 10);
  const minDate = (...ds) => ds.filter(Boolean).sort()[0] || null;
  const fmt = d => d ? new Date(toMs(d)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : '—';
  const weekStart = d => addDays(d, -((new Date(toMs(d)).getUTCDay() + 6) % 7));

  const FINAL_ACTIONS = ['approve', 'reject', 'clear'];
  const PUBLIC = ['LISTED', 'VERIFIED'];
  const EVIDENCE_LABEL = { build_hash: 'Build hash', concept_art: 'Concept art', teaser: 'Teaser link', devlog: 'Dev log', git: 'Git history', document: 'Document' };

  // --- time series helpers ------------------------------------------------------------------
  function seriesAt(series, date, linear) {
    if (series == null) return 0;
    if (typeof series === 'number') return series;
    if (!series.length || date < series[0][0]) return 0;
    for (let i = series.length - 1; i >= 0; i--) {
      if (series[i][0] > date) continue;
      if (linear && i < series.length - 1) {
        const [d0, v0] = series[i], [d1, v1] = series[i + 1];
        return v0 + (v1 - v0) * daysBetween(d0, date) / daysBetween(d0, d1);
      }
      return series[i][1];
    }
    return 0;
  }
  const reviewsAt = (g, d) => Math.floor(seriesAt(g.reviews, d, true));
  const copySignalAt = (g, d) => seriesAt(g.copySignal, d, false);

  // --- world assembly: mock data + anything created during this browser session -------------
  function buildWorld(mock, session) {
    const games = mock.games
      .map(g => session.registrations[g.id] ? { ...g, registration: session.registrations[g.id], sessionRegistration: true } : g)
      .concat(session.games);
    const log = mock.moderationLog.map((e, i) => ({ ...e, seq: i, scripted: true }))
      .concat(session.log.map((e, i) => ({ ...e, seq: 100000 + i, scripted: false })));
    log.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq));
    return {
      games,
      byId: Object.fromEntries(games.map(g => [g.id, g])),
      similarity: mock.similarity,
      claims: mock.claims.concat(session.claims),
      appeals: mock.appeals.concat(session.appeals),
      log,
      sim: mock.simulation,
    };
  }

  const knownFrom = g => minDate(g.dates.steamPageCreated, g.registration && g.registration.filed);
  const isKnown = (g, date) => { const k = knownFrom(g); return !!k && k <= date; };
  const earliestPublic = g => minDate(g.dates.firstPublicRecord, g.dates.steamPageCreated, g.dates.release, ...(g.publicRecords || []).map(r => r.date));
  // Earliest record whose date a third party can confirm (public records + verifiable evidence)
  const earliestIndependent = g => minDate(earliestPublic(g), ...((g.registration && g.registration.evidence) || []).filter(e => e.verifiable).map(e => e.date));

  // --- moderator decisions --------------------------------------------------------------------
  function decisionIndex(world, date) {
    const idx = {};
    for (const e of world.log) if (e.date <= date) (idx[e.triggerId] = idx[e.triggerId] || []).push(e);
    return idx;
  }
  const finalDecision = (idx, tid) => { const es = (idx[tid] || []).filter(e => FINAL_ACTIONS.includes(e.action)); return es[es.length - 1] || null; };
  const annotations = (idx, tid) => (idx[tid] || []).filter(e => !FINAL_ACTIONS.includes(e.action));

  function triggerGameId(world, tid) {
    const [type, ref] = [tid.slice(0, tid.indexOf(':')), tid.slice(tid.indexOf(':') + 1)];
    if (type === 'claim') { const c = world.claims.find(x => x.id === ref); return c && c.targetId; }
    if (type === 'appeal') { const a = world.appeals.find(x => x.id === ref); return a && a.gameId; }
    return ref;
  }

  function registrationState(g, date, idx) {
    if (!g.registration || g.registration.filed > date) return { state: 'none' };
    const d = finalDecision(idx, 'reg:' + g.id);
    if (!d) return { state: 'pending' };
    return { state: d.action === 'approve' ? 'approved' : 'rejected', decision: d };
  }
  const isPrerelease = g => !!g.registration && (!g.dates.release || g.dates.release > g.registration.filed);

  function latestRejection(g, idx) {
    return ['reg:', 'asset:', 'manual:'].map(p => finalDecision(idx, p + g.id))
      .filter(d => d && d.action === 'reject')
      .sort((a, b) => (a.date < b.date ? -1 : 1)).pop() || null;
  }

  // --- claims evidence bar ------------------------------------------------------------------
  function claimBar(claim, world, S) {
    const t = world.byId[claim.targetId];
    const tFirst = t ? earliestPublic(t) : null;
    const checks = [
      { label: 'Dated public source link provided', ok: !!(claim.sourceLink && claim.sourceDate) },
      { label: `Source is dated earlier than the target’s first public record${tFirst ? ` (${fmt(tFirst)})` : ''}`, ok: !!(claim.sourceDate && tFirst && claim.sourceDate < tFirst) },
      { label: 'Names at least one specific, distinctive overlap (genre-level overlap does not count)', ok: !S.CLAIM_REQUIRES_DISTINCTIVE_OVERLAP || (claim.overlaps || []).some(o => o.kind === 'distinctive' && o.text.trim()) },
    ];
    return { ok: checks.every(c => c.ok), checks };
  }

  function similarPairs(g, world) {
    return world.similarity.filter(p => p.a === g.id || p.b === g.id).map(p => ({
      ...p, other: p.a === g.id ? p.b : p.a, score: Math.max(p.title, p.description, p.screenshots, p.keywords),
    }));
  }

  // --- stage 1–5 evaluation (collisions applied afterwards in evaluateAll) -------------------
  function evaluateBase(g, ctx) {
    const { date, S, world, idx, named } = ctx;
    const out = { id: g.id, status: null, reasons: [], triggers: [], checks: null, notes: [], collisions: [], similar: [], cleared: false };
    const done = (status, ...reasons) => { out.status = status; out.reasons.push(...reasons); return out; };
    if (!isKnown(g, date)) return done(null, 'Not in the system yet');

    // 1. Non-accusatory automatic outcomes
    if (g.kind === 'dlc') { const p = world.byId[g.parentId]; return done('ATTACHED', `DLC — attached to parent game “${p ? p.title : g.parentId}”`); }
    if (g.kind && g.kind !== 'game') return done('REJECTED', `Not a game (${g.kind})`);
    if (g.removed && g.removed.date <= date) return done('REJECTED', `${g.removed.reason} (${fmt(g.removed.date)})`);
    if (g.contentPolicy === 'violation') return done('REJECTED', 'Outside content policy');
    if (g.duplicateOf) { const o = world.byId[g.duplicateOf]; return done('REJECTED', `Duplicate listing of “${o ? o.title : g.duplicateOf}”`); }

    // 2. Prior moderator rejection, and appeals against it
    const rej = latestRejection(g, idx);
    const appeals = world.appeals.filter(a => a.gameId === g.id && a.filed <= date);
    let lifted = null;
    if (rej) {
      const after = appeals.filter(a => a.filed >= rej.date);
      lifted = after.map(a => finalDecision(idx, 'appeal:' + a.id)).find(d => d && d.action === 'approve') || null;
      if (!lifted) {
        const open = after.filter(a => !finalDecision(idx, 'appeal:' + a.id));
        const withEvidence = open.find(a => (a.newEvidence || []).length);
        if (withEvidence) {
          out.triggers.push({ id: 'appeal:' + withEvidence.id, type: 'appeal', priority: S.PRIORITY_APPEAL, since: withEvidence.filed, label: 'Appeal with new evidence' });
          out.priority = S.PRIORITY_APPEAL; out.since = withEvidence.filed;
          return done('QUEUED', 'Appeal of a moderator rejection, with new evidence');
        }
        if (open.length) out.notes.push(`Appeal filed ${fmt(open[0].filed)} has no new evidence, so it was not re-queued`);
        out.internalReason = rej.internalReason || rej.note;
        return done('REJECTED', `Rejected by a moderator on ${fmt(rej.date)}; no new evidence since`);
      }
      out.notes.push(`Rejection of ${fmt(rej.date)} lifted on appeal (${fmt(lifted.date)})`);
    }

    // 3. Verified (human decision only)
    const rs = registrationState(g, date, idx);
    if (rs.state === 'approved' || (lifted && g.registration)) {
      out.verifiedOn = rs.state === 'approved' ? rs.decision.date : lifted.date;
      return done('VERIFIED', `Provenance verified by a moderator on ${fmt(out.verifiedOn)}`);
    }

    // 4. Stakeholder waiting → QUEUED
    const pairs = similarPairs(g, world).filter(p => world.byId[p.other] && isKnown(world.byId[p.other], date));
    if (rs.state === 'pending') {
      const pre = isPrerelease(g);
      const live = pairs.filter(p => {
        const o = world.byId[p.other];
        return p.score >= S.SIMILARITY_THRESHOLD && o.dates.release && o.dates.release <= date && !(o.removed && o.removed.date <= date);
      });
      out.triggers.push({
        id: 'reg:' + g.id, type: 'registration', since: g.registration.filed,
        priority: (pre ? S.PRIORITY_PRERELEASE_REGISTRATION : S.PRIORITY_REGISTRATION) + (live.length ? S.PRIORITY_BOOST_LIVE_LOOKALIKE : 0),
        label: (pre ? 'Pre-release registration' : 'Developer registration') + (live.length ? ' · similar game already live' : ''),
      });
    }
    if (g.assetMatch && g.assetMatch.detected <= date) {
      const against = world.byId[g.assetMatch.against];
      const ars = against ? registrationState(against, date, idx).state : 'none';
      if (ars === 'pending' || ars === 'approved') {
        const d = finalDecision(idx, 'asset:' + g.id);
        if (!d) out.triggers.push({ id: 'asset:' + g.id, type: 'asset', priority: S.PRIORITY_ASSET_MATCH, since: g.assetMatch.detected, label: `Asset/code match vs registered build (${g.assetMatch.score.toFixed(2)})` });
        else if (d.action === 'approve') out.notes.push(`Asset/code match reviewed ${fmt(d.date)}: resolved as legitimate`);
      }
    }
    for (const c of world.claims.filter(c => c.targetId === g.id && c.filed <= date)) {
      const d = finalDecision(idx, 'claim:' + c.id);
      if (d) { out.notes.push(`Idea claim ${c.id} ${d.action === 'approve' ? 'upheld' : 'dismissed'} on ${fmt(d.date)}`); continue; }
      if (claimBar(c, world, S).ok) out.triggers.push({ id: 'claim:' + c.id, type: 'claim', priority: S.PRIORITY_CLAIM, since: c.filed, label: `Idea claim by ${c.claimant}` });
      else out.notes.push(`Idea claim ${c.id} (${c.claimant}) is below the evidence bar — no effect on this record`);
    }
    if (!rej) for (const a of appeals) {
      if (!finalDecision(idx, 'appeal:' + a.id)) out.triggers.push({ id: 'appeal:' + a.id, type: 'appeal', priority: S.PRIORITY_APPEAL, since: a.filed, label: 'Appeal from developer' });
    }
    if (out.triggers.length) {
      out.priority = Math.max(...out.triggers.map(t => t.priority));
      out.since = minDate(...out.triggers.map(t => t.since));
      return done('QUEUED', ...out.triggers.map(t => t.label));
    }

    // 5. Fact checks
    const heldClear = finalDecision(idx, 'held:' + g.id);
    const appealOk = appeals.some(a => (finalDecision(idx, 'appeal:' + a.id) || {}).action === 'approve');
    out.cleared = !!lifted || appealOk || (heldClear && heldClear.action === 'clear');
    const rel = g.dates.release && g.dates.release <= date ? g.dates.release : null;
    const age = rel ? daysBetween(rel, date) : null;
    const reviews = reviewsAt(g, date);
    const copy = copySignalAt(g, date);
    const namedBy = named[g.id] || [];
    out.checks = {
      age: { label: 'Days since release', ok: age !== null && age >= S.MIN_DAYS_RELEASED, value: age === null ? 'unreleased' : `${age}${g.earlyAccess ? ' (Early Access)' : ''}`, need: `≥ ${S.MIN_DAYS_RELEASED}` },
      reviews: { label: 'Review count', ok: reviews >= S.MIN_REVIEWS, value: reviews, need: `≥ ${S.MIN_REVIEWS}` },
      copy: { label: 'Review copy-signal score', ok: copy < S.COPY_SIGNAL_THRESHOLD, value: copy.toFixed(2), need: `< ${S.COPY_SIGNAL_THRESHOLD}`, extra: g.genreSignal ? `genre comparisons excluded: ${g.genreSignal.toFixed(2)}` : '' },
      named: { label: 'Named as the original on another game’s page', ok: !S.NAMED_AS_ORIGINAL_CHECK || !namedBy.length, value: namedBy.length ? 'by ' + namedBy.map(n => world.byId[n.by].title).join(', ') : 'no', need: S.NAMED_AS_ORIGINAL_CHECK ? 'no' : '(check disabled)' },
    };
    if (out.cleared) out.notes.push('Signals cleared by a moderator; copy-signal, naming and similarity checks waived');
    const signalFails = [];
    if (!out.checks.copy.ok) signalFails.push(`Review copy-signal score ${copy.toFixed(2)} ≥ ${S.COPY_SIGNAL_THRESHOLD}`);
    if (!out.checks.named.ok) signalFails.push(`Named as the original in reviews on ${out.checks.named.value.slice(3)}`);
    if (!out.cleared && signalFails.length) return done('HELD', ...signalFails);
    if (!out.checks.age.ok || !out.checks.reviews.ok) {
      return done('NOT_YET_ELIGIBLE', ...[
        !out.checks.age.ok && (age === null ? 'Not released yet' : `Released ${age} days ago (needs ${S.MIN_DAYS_RELEASED})`),
        !out.checks.reviews.ok && `${reviews} reviews (needs ${S.MIN_REVIEWS})`,
      ].filter(Boolean));
    }
    return done('LISTED', 'Passes every automatic check');
  }

  function evaluateAll(world, date, S) {
    const idx = decisionIndex(world, date);
    const named = {};
    for (const h of world.games) {
      if (!isKnown(h, date)) continue;
      for (const n of h.namesOriginal || []) if (n.from <= date) (named[n.id] = named[n.id] || []).push({ by: h.id, from: n.from });
    }
    const ctx = { date, S, world, idx, named };
    const res = {};
    for (const g of world.games) res[g.id] = evaluateBase(g, ctx);

    // Reference set R for similarity collisions (see header comment)
    // Snapshot R from the base results BEFORE applying collisions, so evaluation order doesn't matter.
    const R = new Set(world.games.filter(g => {
      const r = res[g.id];
      if (!r.status || r.status === 'REJECTED' || r.status === 'ATTACHED') return false;
      const rs = registrationState(g, date, idx).state;
      return rs === 'pending' || rs === 'approved' || PUBLIC.includes(r.status);
    }).map(g => g.id));
    const inR = id => R.has(id);
    for (const g of world.games) {
      const r = res[g.id];
      if (!r.status) continue;
      r.similar = similarPairs(g, world)
        .filter(p => world.byId[p.other] && isKnown(world.byId[p.other], date))
        .map(p => ({ ...p, otherInR: inR(p.other) }));
      r.collisions = r.similar.filter(p => p.score >= S.SIMILARITY_THRESHOLD && p.otherInR);
      if (r.checks) r.checks.collision = {
        label: 'Similarity collision with a listed/registered game', ok: !r.collisions.length || r.cleared,
        value: r.collisions.length ? r.collisions.map(p => `${world.byId[p.other].title} (${p.score.toFixed(2)})`).join(', ') : 'none', need: `none ≥ ${S.SIMILARITY_THRESHOLD}`,
      };
      if (['LISTED', 'NOT_YET_ELIGIBLE', 'HELD'].includes(r.status) && r.collisions.length && !r.cleared) {
        if (r.status !== 'HELD') { r.status = 'HELD'; r.reasons = []; }
        r.reasons.push(`Similarity ≥ ${S.SIMILARITY_THRESHOLD} with ${r.collisions.map(p => `“${world.byId[p.other].title}” (${p.score.toFixed(2)})`).join(', ')}`);
      }
    }
    return res;
  }

  // --- expectations & tests -----------------------------------------------------------------
  function expectedAt(g, date) {
    let s = null;
    for (const [d, st] of g.expected || []) if (d <= date) s = st;
    return s;
  }
  function sessionTouched(world, gameId, date) {
    const g = world.byId[gameId];
    if (g.sessionRegistration && g.registration.filed <= date) return true;
    if (world.log.some(e => !e.scripted && e.date <= date && triggerGameId(world, e.triggerId) === gameId)) return true;
    if (world.claims.some(c => c.session && c.targetId === gameId && c.filed <= date)) return true;
    if (world.appeals.some(a => a.session && a.gameId === gameId && a.filed <= date)) return true;
    return false;
  }
  function runTests(world, date, results) {
    return world.games.filter(g => g.expected).map(g => {
      const r = results[g.id];
      const expected = expectedAt(g, date), actual = r.status;
      return {
        id: g.id, case: g.case, scenario: g.scenario, title: g.title, truth: g.truth, expected, actual,
        pass: expected === actual, worst: g.truth === 'non-original' && PUBLIC.includes(actual),
        overridden: sessionTouched(world, g.id, date), reasons: r.reasons,
      };
    });
  }
  function claimTests(world, S) {
    return world.claims.filter(c => c.expectedBar !== undefined).map(c => {
      const bar = claimBar(c, world, S);
      return { id: c.id, case: c.case, claimant: c.claimant, target: world.byId[c.targetId].title, expected: c.expectedBar, actual: bar.ok, pass: c.expectedBar === bar.ok };
    });
  }
  // Run the whole timeline day by day; return failing/worst-case runs collapsed into date ranges.
  function sweep(world, S) {
    const runs = [], open = {};
    for (let d = world.sim.start; d <= world.sim.end; d = addDays(d, 1)) {
      const tests = runTests(world, d, evaluateAll(world, d, S));
      for (const t of tests) {
        const bad = !t.overridden && (!t.pass || t.worst);
        const key = bad ? `${t.expected}|${t.actual}|${t.worst}` : null;
        const cur = open[t.id];
        if (cur && cur.key === key) { cur.to = d; continue; }
        if (cur) { runs.push(cur); delete open[t.id]; }
        if (bad) open[t.id] = { key, id: t.id, case: t.case, title: t.title, from: d, to: d, expected: t.expected, actual: t.actual, worst: t.worst, pass: t.pass };
      }
    }
    return runs.concat(Object.values(open)).sort((a, b) => (a.from < b.from ? -1 : 1));
  }

  // --- timeline helpers for UI ----------------------------------------------------------------
  function partyEvents(g) {
    const ev = [];
    const pubDates = new Set((g.publicRecords || []).map(r => r.date));
    (g.publicRecords || []).forEach(r => ev.push({ date: r.date, text: r.label, kind: 'public', url: r.url }));
    if (g.dates.steamPageCreated) ev.push({ date: g.dates.steamPageCreated, text: 'Steam page created', kind: 'public' });
    if (g.dates.release) ev.push({ date: g.dates.release, text: g.earlyAccess ? 'Released in Early Access' : 'Released on Steam', kind: 'public' });
    if (g.removed) ev.push({ date: g.removed.date, text: 'Removed from Steam', kind: 'public' });
    if (g.registration) {
      ev.push({ date: g.registration.filed, text: 'Provenance registration filed', kind: 'system' });
      for (const e of g.registration.evidence) {
        if (e.verifiable && pubDates.has(e.date)) continue;
        ev.push({ date: e.date, text: `${EVIDENCE_LABEL[e.type] || e.type}: ${e.label}`, kind: e.verifiable ? 'public' : 'self' });
      }
    }
    return ev.sort((a, b) => (a.date < b.date ? -1 : 1));
  }
  function scriptedEvents(world) {
    const ev = [];
    for (const g of world.games) {
      if (g.dates.steamPageCreated) ev.push({ date: g.dates.steamPageCreated, text: `${g.title}: Steam page created (auto-import)` });
      if (g.dates.release) ev.push({ date: g.dates.release, text: `${g.title}: ${g.earlyAccess ? 'Early Access release' : 'release'}` });
      if (g.registration) ev.push({ date: g.registration.filed, text: `${g.title}: developer registration filed` });
      if (g.assetMatch) ev.push({ date: g.assetMatch.detected, text: `${g.title}: asset/code match detected` });
      if (g.removed) ev.push({ date: g.removed.date, text: `${g.title}: removed from Steam` });
      if (Array.isArray(g.copySignal)) g.copySignal.forEach(([d, v]) => ev.push({ date: d, text: `${g.title}: review copy-signal score → ${v}` }));
      if (Array.isArray(g.reviews) && g.reviews.length > 2) ev.push({ date: g.reviews[g.reviews.length - 2][0], text: `${g.title}: ${g.reviews[g.reviews.length - 2][1]} reviews` });
      (g.namesOriginal || []).forEach(n => ev.push({ date: n.from, text: `Reviews on ${g.title} begin naming ${(world.byId[n.id] || {}).title} as the original` }));
    }
    world.claims.forEach(c => ev.push({ date: c.filed, text: `Idea claim filed by ${c.claimant} → ${(world.byId[c.targetId] || {}).title}` }));
    world.appeals.forEach(a => ev.push({ date: a.filed, text: `Appeal filed for ${(world.byId[a.gameId] || {}).title}` }));
    world.log.forEach(e => ev.push({ date: e.date, text: `Moderator ${e.action.replace('_', ' ')}: ${e.triggerId}` }));
    return ev.filter(e => e.date >= world.sim.start).sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  return {
    fmt, daysBetween, addDays, weekStart, reviewsAt, copySignalAt, buildWorld, isKnown, earliestPublic, earliestIndependent,
    decisionIndex, finalDecision, annotations, registrationState, isPrerelease, claimBar, evaluateAll, expectedAt,
    runTests, claimTests, sweep, partyEvents, scriptedEvents, triggerGameId, EVIDENCE_LABEL, PUBLIC,
  };
})();
if (typeof module !== 'undefined') module.exports = { Engine, MOCK_DATA };
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;
const M = MOCK_DATA, E = Engine, fmt = E.fmt;
const AI_CATS = M.aiCategories;

// ---------- small presentational pieces ----------
const STATUS_STYLE = {
  LISTED: 'bg-sky-900/60 text-sky-200 ring-sky-500/40',
  VERIFIED: 'bg-emerald-900/60 text-emerald-200 ring-emerald-500/40',
  NOT_YET_ELIGIBLE: 'bg-slate-700/60 text-slate-200 ring-slate-400/40',

};
function StatusPill({ s }) {

  return <span className={`inline-block whitespace-nowrap rounded px-1.5 py-0.5 text-[11px] font-semibold tracking-wide ring-1 ${STATUS_STYLE[s]}`}>{s}</span>;
}
function VerifiedBadge({ small }) {
  return (
    <span title="Granted by a human moderator after the developer registered dated provenance evidence."
      className={`inline-flex items-center gap-1 rounded bg-emerald-600 font-semibold text-white shadow ${small ? 'px-1.5 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs'}`}>
      <svg viewBox="0 0 20 20" className={small ? 'h-3 w-3' : 'h-4 w-4'} fill="currentColor"><path d="M10 1l2.4 2.1 3.2-.2.6 3.1 2.6 1.9-1.3 2.9 1.3 2.9-2.6 1.9-.6 3.1-3.2-.2L10 21l-2.4-2.1-3.2.2-.6-3.1-2.6-1.9L2.5 11 1.2 8.1l2.6-1.9.6-3.1 3.2.2z" opacity=".35"/><path d="M8.6 13.4L5.5 10.3l1.2-1.2 1.9 1.9 4.7-4.7 1.2 1.2z"/></svg>
      Verified Provenance
    </span>

}
function Capsule({ g, className = '', label = true }) {
  const [a, b] = g.colors || ['#334155', '#64748b'];

    <div className={`relative overflow-hidden rounded-sm ${className}`} style={{ background: `linear-gradient(135deg, ${a} 0%, ${b} 100%)` }}>

    </div>

}
function reviewLabel(pct, n) {
  if (!n) return { text: 'No user reviews', cls: 'text-steam-dim' };
  if (n < 10) return { text: `${n} user reviews`, cls: 'text-steam-dim' };
  if (pct >= 95 && n >= 500) return { text: 'Overwhelmingly Positive', cls: 'text-steam-accent' };
  if (pct >= 80) return { text: n >= 50 ? 'Very Positive' : 'Positive', cls: 'text-steam-accent' };
  if (pct >= 70) return { text: 'Mostly Positive', cls: 'text-steam-accent' };
  if (pct >= 40) return { text: 'Mixed', cls: 'text-amber-300' };
  if (pct >= 20) return { text: 'Mostly Negative', cls: 'text-rose-300' };
  return { text: 'Negative', cls: 'text-rose-300' };
}
const AI_LEVEL = {
  none: { text: 'None', cls: 'text-steam-dim' },
  assisted: { text: 'Assisted (human-edited)', cls: 'text-sky-300' },
  generated: { text: 'Generated', cls: 'text-fuchsia-300' },
};
const aiLevel = (g, k) => (g.ai && g.ai[k]) || 'none';
const Section = ({ title, children, right }) => (
  <section className="rounded bg-steam-panel/80 p-4 ring-1 ring-black/30">

    {children}
  </section>
);
const Btn = ({ children, kind = 'default', className = '', ...p }) => {

    default: 'bg-steam-card hover:bg-steam-line text-steam-text',
    primary: 'bg-gradient-to-r from-[#75b022] to-[#588a1b] text-white hover:brightness-110',

};
const Field = ({ label, hint, children }) => (
  <label className="block text-sm"><span className="mb-1 block text-steam-dim">{label}</span>{children}{hint && <span className="mt-1 block text-xs text-steam-dim/80">{hint}</span>}</label>
);
const MockLink = ({ href, children, className = '' }) => (
  <a href={href} onClick={e => { e.preventDefault(); alertMock(href); }} className={className}>{children}</a>
);
let alertMock = () => {};

// ---------- App ----------
function App() {
  const [date, _setDate] = useState(M.simulation.defaultDate);
  const [settings, _setSettings] = useState({ ...M.settings });
  const [session, _setSession] = useState({ log: [], games: [], claims: [], appeals: [], registrations: {} });
  // Deep links: #moderation, #tests, #settings, #register, #claim, #game=<id> (internal preview)
  const [route, setRoute] = useState(() => {
    const [view, id] = location.hash.slice(1).split('=');
    return view === 'game' ? { view, id, internal: true } : { view: view || 'browse' };
  });
  const [browse, setBrowse] = useState({ q: '', tags: [], verifiedOnly: false, noAI: [], sort: 'reviews' });
  const [toast, setToast] = useState(null);
  alertMock = href => { setToast(`Mock outbound link (not followed): ${href}`); setTimeout(() => setToast(null), 3500); };

  const cause = useRef('initial load');
  const setDate = d => { cause.current = 'date change'; _setDate(d); };
  const setSettings = s => { cause.current = 'settings change'; _setSettings(s); };
  const setSession = fn => { cause.current = 'session action'; _setSession(fn); };

  const world = useMemo(() => E.buildWorld(M, session), [session]);
  const run = useMemo(() => {
    const t0 = performance.now();
    const results = E.evaluateAll(world, date, settings);
    const tests = E.runTests(world, date, results);
    return { results, tests, ms: performance.now() - t0 };
  }, [world, date, settings]);

  // Track status changes and test pass/fail flips between engine runs.
  const prev = useRef(null);
  const [delta, setDelta] = useState({ changes: [], tests: {}, cause: '' });
  useEffect(() => {
    const p = prev.current;
    if (p) {
      const changes = world.games
        .filter(g => (p.results[g.id] ? p.results[g.id].status : null) !== run.results[g.id].status)
        .map(g => ({ id: g.id, title: g.title, from: p.results[g.id] ? p.results[g.id].status : null, to: run.results[g.id].status }));
      const tests = {};
      run.tests.forEach(t => { const pt = p.tests.find(x => x.id === t.id); if (pt && pt.pass !== t.pass) tests[t.id] = t.pass ? 'fixed' : 'broke'; });
      setDelta({ changes, tests, cause: cause.current, at: Date.now() });
    }
    prev.current = { results: run.results, tests: run.tests };
  }, [run]);

  const act = (triggerId, action, extra = {}) =>
    setSession(s => ({ ...s, log: [...s.log, { id: 's' + (s.log.length + 1), date, triggerId, action, by: 'you (session)', ...extra }] }));
  const go = (view, extra = {}) => { setRoute({ view, ...extra }); window.scrollTo(0, 0); };
  const ctx = { world, date, settings, results: run.results, tests: run.tests, go, act, session, setSession, setDate, setSettings, delta };

  let page;
  if (route.view === 'browse') page = <Browse {...ctx} f={browse} setF={setBrowse} />;
  else if (route.view === 'game') page = <GamePage {...ctx} id={route.id} internal={route.internal} />;
  else if (route.view === 'register') page = <RegisterFlow {...ctx} />;
  else if (route.view === 'claim') page = <ClaimForm {...ctx} targetId={route.targetId} />;
  else if (route.view === 'moderation') page = <Moderation {...ctx} />;
  else if (route.view === 'settings') page = <SettingsPanel {...ctx} />;
  else if (route.view === 'tests') page = <TestsPanel {...ctx} />;

  return (
    <div className="min-h-screen">
      <Nav route={route} go={go} tests={run.tests} />
      <SimBar {...ctx} ms={run.ms} />
      <main className="mx-auto max-w-7xl px-4 py-6">{page}</main>
      <footer className="mx-auto max-w-7xl px-4 pb-10 pt-4 text-xs text-steam-dim">
        Firstmark lists a curated selection of games and does not sell anything. Every store button leads to Steam or the developer’s own store.
        A game’s absence from Firstmark says nothing about it — we do not attempt to list every game. All games, studios and people on this page are fictional.
      </footer>
      {toast && <div className="fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded bg-black/90 px-4 py-2 text-sm text-white ring-1 ring-steam-accent/50">{toast}</div>}
    </div>
  );
}

function Nav({ route, go, tests }) {
  const fails = tests.filter(t => !t.pass && !t.overridden).length;
  const worst = tests.filter(t => t.worst).length;
  const link = (v, label) => (
    <button onClick={() => go(v)} className={`px-3 py-3 text-sm font-medium uppercase tracking-wide ${route.view === v ? 'border-b-2 border-steam-accent text-white' : 'border-b-2 border-transparent text-steam-text hover:text-white'}`}>{label}</button>
  );
  return (
    <header className="border-b border-black/50 bg-steam-deep">
      <div className="mx-auto flex max-w-7xl flex-wrap items-center gap-x-1 px-4">
        <button onClick={() => go('browse')} className="mr-4 py-3 text-lg font-black tracking-[.2em] text-white">FIRSTMARK<span className="ml-1 align-top text-[9px] font-normal tracking-normal text-steam-dim">prototype</span></button>
        {link('browse', 'Store')}{link('register', 'Register a game')}{link('claim', 'Submit a claim')}
        <span className="mx-2 hidden h-5 w-px bg-steam-line sm:block" />

        {link('moderation', 'Moderation')}{link('settings', 'Settings')}
        <button onClick={() => go('tests')} className={`flex items-center gap-2 px-3 py-3 text-sm font-medium uppercase tracking-wide ${route.view === 'tests' ? 'border-b-2 border-steam-accent text-white' : 'border-b-2 border-transparent hover:text-white'}`}>
          Tests
          <span className={`rounded px-1.5 text-[11px] ${worst ? 'bg-rose-600 text-white' : fails ? 'bg-amber-600 text-white' : 'bg-emerald-700 text-white'}`}>

          </span>
        </button>

}

function SimBar({ date, setDate, world, delta, ms, results }) {
  const { start, end, defaultDate } = M.simulation;
  const total = E.daysBetween(start, end), cur = E.daysBetween(start, date);
  const events = useMemo(() => E.scriptedEvents(world), [world]);
  const upcoming = events.filter(e => e.date > date).slice(0, 3);
  const clamp = d => (d < start ? start : d > end ? end : d);
  const step = n => setDate(clamp(E.addDays(date, n)));
  const known = world.games.filter(g => results[g.id].status).length;
  return (
    <div className="sticky top-0 z-40 border-b border-black/40 bg-[#101822]/95 backdrop-blur">

          {[1, 7].map(n => <Btn key={n} className="!px-2 !py-0.5 text-xs" onClick={() => step(n)}>+{n}d</Btn>)}

        </div>
        <span className="text-steam-dim">Engine re-ran on {known} records in {ms.toFixed(1)} ms</span>
        {upcoming.length > 0 && (
          <span className="text-steam-dim">Next: {upcoming.map((e, i) => <span key={i} className="mr-2"><button className="text-steam-accent hover:underline" onClick={() => setDate(e.date)}>{fmt(e.date)}</button> {e.text}</span>)}</span>
        )}
      </div>
      {delta.changes.length > 0 && (
        <div key={delta.at} className="mx-auto max-w-7xl px-4 pb-2 text-xs">
          <span className="text-steam-dim">Status changes after {delta.cause}: </span>
          {delta.changes.slice(0, 8).map(c => (
            <span key={c.id} className="mr-3 whitespace-nowrap">{c.title} <StatusPill s={c.from} /> → <StatusPill s={c.to} /></span>
          ))}
          {delta.changes.length > 8 && <span className="text-steam-dim">+{delta.changes.length - 8} more</span>}
        </div>
      )}
    </div>
  );
}

// ---------- 1. Browse ----------
function Browse({ world, results, date, go, f, setF }) {

        {featured && (
          <button onClick={() => go('game', { id: featured.id })} className="group grid w-full overflow-hidden rounded bg-steam-panel text-left shadow-lg ring-1 ring-black/40 sm:grid-cols-[1.6fr_1fr]">
            <Capsule g={featured} className="aspect-[460/215] w-full" />
            <div className="flex flex-col gap-2 p-4">

                  <div className="flex flex-wrap gap-1">{g.tags.slice(0, 3).map(t => <span key={t} className="rounded bg-steam-card px-1.5 text-[11px]">{t}</span>)}</div>

                </div>

            );
          })}
        </div>
      </div>

      <aside className="space-y-4">
        <Section title="Show">
          <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={f.verifiedOnly} onChange={e => set({ verifiedOnly: e.target.checked })} /> <VerifiedBadge small /> only</label>
        </Section>

            <Btn className="!px-2 !py-0.5 text-[11px]" onClick={() => set({ noAI: AI_CATS.map(c => c.key).filter(k => k !== 'code') })}>Allow AI code only</Btn>
            <Btn className="!px-2 !py-0.5 text-[11px]" onClick={() => set({ noAI: ['art', 'voice'] })}>No AI art or voice</Btn>

          ))}

        <Section title="Tags" right={f.tags.length > 0 && <button className="text-xs text-steam-accent" onClick={() => set({ tags: [] })}>clear</button>}>
          <div className="flex flex-wrap gap-1">
            {allTags.map(t => (
              <button key={t} onClick={() => set({ tags: toggle(f.tags, t) })} className={`rounded px-2 py-0.5 text-xs ${f.tags.includes(t) ? 'bg-steam-accent text-steam-deep' : 'bg-steam-card hover:bg-steam-line'}`}>{t}</button>
            ))}
          </div>
        </Section>
        <p className="px-1 text-xs text-steam-dim">Firstmark shows a curated subset. Not finding a game here says nothing about it.</p>
      </aside>
    </div>
  );
}

// ---------- 2. Game page ----------
function GamePage({ world, results, date, go, id, internal, settings }) {
  const g = world.byId[id];
  if (!g) return <div>Unknown game.</div>;
  const r = results[g.id];
  const isPublic = E.PUBLIC.includes(r.status);
  const n = E.reviewsAt(g, date), rl = reviewLabel(g.positivePct, n);
  const idx = E.decisionIndex(world, date);
  const records = E.partyEvents(g).filter(e => e.date <= date && e.kind !== 'self' && e.kind !== 'system');
  if (r.status === 'VERIFIED') {
    records.push({ date: g.registration.filed, text: `Developer registered provenance (${g.registration.evidence.length} evidence items)`, kind: 'system' });
    records.push({ date: r.verifiedOn, text: 'Provenance verified by a Firstmark moderator', kind: 'verified' });
    records.sort((a, b) => (a.date < b.date ? -1 : 1));
  }
  const ideaClaims = world.claims.filter(c => c.targetId === g.id && (E.finalDecision(idx, 'claim:' + c.id) || {}).action === 'approve');
  const dlc = world.games.filter(x => x.parentId === g.id && results[x.id].status === 'ATTACHED');

  if (!isPublic && !internal) {
    return <div className="rounded bg-steam-panel p-8 text-center text-steam-dim">This page isn’t available. <button className="text-steam-accent" onClick={() => go('browse')}>Back to the store</button></div>;
  }
  return (
    <div className="space-y-5">
      {!isPublic && (
        <div className="rounded border border-amber-500/40 bg-amber-950/40 px-4 py-2 text-sm text-amber-200">
          Internal preview — this record is not public (status <StatusPill s={r.status} />). Visitors see a neutral “page not available” message.
          <button className="ml-3 text-steam-accent underline" onClick={() => go('moderation')}>Back to moderation</button>
        </div>
      )}
      <div className="text-xs text-steam-dim"><button onClick={() => go('browse')} className="hover:text-white">Store</button> › {g.tags[0]} › {g.title}</div>
      <div className="flex flex-wrap items-center gap-3">
        <h1 className="text-3xl font-bold text-white">{g.title}</h1>
        {r.status === 'VERIFIED' && <VerifiedBadge />}
      </div>

      <div className="grid gap-5 lg:grid-cols-[1.7fr_1fr]">
        <div className="space-y-3">
          <Capsule g={g} className="aspect-video w-full" label={false} />
          <div className="grid grid-cols-4 gap-2">
            {[0, 1, 2, 3].map(i => <div key={i} className="aspect-video rounded-sm opacity-80" style={{ background: `linear-gradient(${45 + i * 70}deg, ${g.colors[0]}, ${g.colors[1]})` }} />)}
          </div>
        </div>
        <div className="space-y-3 rounded bg-black/20 p-4 text-sm">
          <Capsule g={g} className="aspect-[460/215] w-full" />
          <p className="text-steam-text/90">{g.desc}</p>
          <dl className="grid grid-cols-[110px_1fr] gap-y-1 text-xs">
            <dt className="text-steam-dim">ALL REVIEWS:</dt><dd className={rl.cls}>{rl.text} <span className="text-steam-dim">({n.toLocaleString()})</span></dd>
            <dt className="text-steam-dim">RELEASE DATE:</dt><dd>{g.dates.release && g.dates.release <= date ? fmt(g.dates.release) + (g.earlyAccess ? ' (Early Access)' : '') : 'Not yet released'}</dd>
            <dt className="text-steam-dim">DEVELOPER:</dt><dd className="text-steam-accent">{g.studio}</dd>
          </dl>
          <div className="flex flex-wrap gap-1">{g.tags.map(t => <span key={t} className="rounded bg-steam-card px-1.5 text-[11px]">{t}</span>)}</div>
        </div>
      </div>

      <div className="grid gap-5 lg:grid-cols-[1.7fr_1fr]">
        <div className="space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3 rounded bg-gradient-to-r from-steam-card to-steam-panel p-4">
            <div><div className="text-lg font-semibold text-white">Get {g.title}</div><div className="text-xs text-steam-dim">Firstmark doesn’t sell games. You’ll leave this site to buy.</div></div>
            <div className="flex gap-2">
              {g.links.steam && <MockLink href={g.links.steam} className="rounded bg-gradient-to-r from-[#75b022] to-[#588a1b] px-4 py-2 text-sm font-semibold text-white">View on Steam ↗</MockLink>}
              {g.links.dev && <MockLink href={g.links.dev} className="rounded bg-steam-accent/20 px-4 py-2 text-sm font-semibold text-steam-accent">Developer’s store ↗</MockLink>}
            </div>
          </div>

          {dlc.length > 0 && (
            <Section title="Downloadable content">
              {dlc.map(d => <div key={d.id} className="flex items-center gap-3 py-1 text-sm"><Capsule g={d} className="h-10 w-20" label={false} /><span className="text-white">{d.title}</span><MockLink href={d.links.steam} className="ml-auto text-xs text-steam-accent">Steam ↗</MockLink></div>)}
            </Section>
          )}

          <Section title="Provenance timeline" right={<span className="text-[11px] text-steam-dim">dated public records only</span>}>
            <ol className="relative ml-2 border-l border-steam-line">
              {records.map((e, i) => (
                <li key={i} className="mb-3 ml-4">
                  <span className={`absolute -left-1.5 mt-1 h-3 w-3 rounded-full ${e.kind === 'verified' ? 'bg-emerald-500' : 'bg-steam-accent'}`} />
                  <div className="text-xs text-steam-dim">{fmt(e.date)}</div>
                  <div className={e.kind === 'verified' ? 'font-semibold text-emerald-300' : 'text-white'}>

                  </div>
                </li>
              ))}
            </ol>
            {r.status !== 'VERIFIED' && <p className="text-xs text-steam-dim">The developer has not registered provenance for this game. That is common and implies nothing.</p>}
          </Section>

          {ideaClaims.map(c => (
            <section key={c.id} className="rounded border-2 border-dashed border-amber-500/40 bg-amber-950/20 p-4">
              <h3 className="mb-1 text-xs font-bold uppercase tracking-widest text-amber-300">Idea timeline (moderated, lower certainty)</h3>
              <p className="mb-3 text-xs text-amber-100/70">A moderator confirmed the dates below. This states dates only. It makes no finding about how either game was made.</p>
              <ul className="space-y-1 text-sm">
                <li><b className="text-white">{c.claimant}</b> ({c.claimantProject}) publicly showed this concept on <b>{fmt(c.sourceDate)}</b>. <MockLink href={c.sourceLink} className="text-steam-accent">source ↗</MockLink></li>
                <li><b className="text-white">{g.title}</b>’s Steam page was created on <b>{fmt(g.dates.steamPageCreated)}</b>.</li>
              </ul>
              <p className="mt-2 text-xs text-steam-dim">Overlapping elements noted: {c.overlaps.filter(o => o.kind === 'distinctive').map(o => o.text).join('; ')}.</p>
            </section>
          ))}

          <Section title="Recent reviews">
            {(g.reviewSamples || []).filter(rv => rv.signal !== 'copy').map((rv, i) => (
              <div key={i} className="mb-2 rounded bg-black/20 p-3 text-sm"><div className="mb-1 text-xs text-steam-accent">{rv.author}</div>{rv.text}</div>
            ))}
            {!(g.reviewSamples || []).some(rv => rv.signal !== 'copy') && <div className="text-sm text-steam-dim">No reviews to show.</div>}
          </Section>
        </div>

        <div className="space-y-5">
          <Section title="AI usage disclosure">
            <table className="w-full text-xs">
              <tbody>
                {AI_CATS.map(c => { const lv = aiLevel(g, c.key); return (
                  <tr key={c.key} className="border-b border-steam-line/40"><td className="py-1 pr-2 text-steam-dim">{c.label}</td><td className={`py-1 text-right font-medium ${AI_LEVEL[lv].cls}`}>{AI_LEVEL[lv].text}</td></tr>
                ); })}
              </tbody>
            </table>
            <div className="mt-3 text-[11px] uppercase tracking-wide text-steam-dim">Source: {g.aiSource === 'developer' ? 'stated by the developer' : 'parsed from the Steam AI disclosure'}</div>
            <blockquote className="mt-1 border-l-2 border-steam-line pl-2 text-xs italic text-steam-text/80">{g.aiQuote}</blockquote>
          </Section>
          {isPublic && (
            <div className="rounded bg-steam-panel/60 p-3 text-xs text-steam-dim">
              Did this game use a concept you showed publicly first? <button className="text-steam-accent hover:underline" onClick={() => go('claim', { targetId: g.id })}>Submit an idea claim</button> with a dated source. Claims are reviewed by people and only ever published as a factual timeline.
            </div>
          )}
          {internal && <EngineChecks r={r} />}
        </div>
      </div>
    </div>
  );
}

function EngineChecks({ r }) {
  return (
    <Section title="Rules engine (internal)">
      <div className="mb-2"><StatusPill s={r.status} /></div>
      <ul className="mb-2 list-disc pl-4 text-xs">{r.reasons.map((x, i) => <li key={i}>{x}</li>)}</ul>
      {r.checks && (
        <table className="w-full text-xs">
          <tbody>
            {Object.values(r.checks).map(c => (
              <tr key={c.label} className="border-t border-steam-line/40">
                <td className="py-1 pr-1">{c.ok ? <span className="text-emerald-400">✓</span> : <span className="text-amber-400">✗</span>}</td>
                <td className="py-1 pr-2 text-steam-dim">{c.label}{c.extra && <div className="text-[10px]">{c.extra}</div>}</td>
                <td className="py-1 text-right">{String(c.value)} <span className="text-steam-dim">({c.need})</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      {r.notes.length > 0 && <ul className="mt-2 list-disc pl-4 text-[11px] text-steam-dim">{r.notes.map((x, i) => <li key={i}>{x}</li>)}</ul>}
