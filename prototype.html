  );
}

// ---------- 3. Developer registration ----------
const EVIDENCE_TYPES = Object.entries(E.EVIDENCE_LABEL);
async function sha256(file) {
  try {
    const buf = await file.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return 'sha256:' + [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'sha256:(unavailable in this browser context)'; }
}
function RegisterFlow({ world, results, date, go, setSession, settings }) {
  const blank = { mode: 'new', existingId: '', title: '', studio: '', contact: '', prerelease: true, releaseDate: '', steamUrl: '', teaserUrl: '', teaserDate: '', tags: '', ai: {}, aiQuote: '', evidence: [{ type: 'build_hash', date: '', label: '', value: '', verifiable: false }] };
  const [s, setS] = useState(blank);
  const [step, setStep] = useState(1);
  const [receipt, setReceipt] = useState(null);
  const set = p => setS({ ...s, ...p });
  const setEv = (i, p) => set({ evidence: s.evidence.map((e, j) => (j === i ? { ...e, ...p } : e)) });
  const known = world.games.filter(g => results[g.id].status && g.kind === 'game' && !g.registration);

  const submit = () => {
    const evidence = s.evidence.filter(e => e.label || e.value).map(e => ({ ...e, date: e.date || date, verifiable: e.type === 'teaser' || e.type === 'devlog' ? !!e.value.startsWith('http') : e.verifiable }));
    if (s.teaserUrl) evidence.push({ type: 'teaser', date: s.teaserDate || date, label: 'Teaser / first public showing', value: s.teaserUrl, verifiable: true });
    const registration = { filed: date, by: s.contact || 'Session developer', evidence };
    if (s.mode === 'existing' && s.existingId) {
      setSession(x => ({ ...x, registrations: { ...x.registrations, [s.existingId]: registration } }));
      setReceipt({ id: s.existingId, title: world.byId[s.existingId].title, filed: date, n: evidence.length });
    } else {
      const id = 'reg-' + Math.random().toString(36).slice(2, 7);
      const hue = Math.floor(Math.random() * 360);
      const g = {
        id, case: null, scenario: 'Created in this session', title: s.title || 'Untitled project', studio: s.studio || 'Unnamed studio', kind: 'game',
        tags: s.tags ? s.tags.split(',').map(t => t.trim()).filter(Boolean) : ['Indie'], colors: [`hsl(${hue} 50% 22%)`, `hsl(${(hue + 50) % 360} 70% 60%)`],
        desc: 'Registered during this session.', links: { steam: s.steamUrl || null, dev: s.teaserUrl || null },
        dates: { firstPublicRecord: s.teaserDate || null, steamPageCreated: s.steamUrl ? date : null, release: s.prerelease ? null : (s.releaseDate || date) },
        publicRecords: s.teaserUrl ? [{ date: s.teaserDate || date, label: 'Teaser / first public showing', url: s.teaserUrl }] : [],
        reviews: 0, copySignal: 0, registration, ai: s.ai, aiSource: 'developer', aiQuote: s.aiQuote || '(no statement provided)', truth: 'unknown', session: true,
      };
      setSession(x => ({ ...x, games: [...x.games, g] }));
      setReceipt({ id, title: g.title, filed: date, n: evidence.length });
    }
    setStep(5);
  };

  const r = receipt && results[receipt.id];
  const steps = ['Game', 'Evidence', 'AI disclosure', 'Review'];
  return (
    <div className="mx-auto max-w-3xl space-y-4">
      <h1 className="text-2xl font-bold text-white">Register a game</h1>
      <p className="text-sm text-steam-dim">Registering creates a dated provenance record. You can register before you have a Steam page. A moderator reviews every registration; only a moderator can grant Verified Provenance.</p>
      <div className="flex gap-1 text-xs">{steps.map((t, i) => <div key={t} className={`flex-1 rounded px-2 py-1 text-center ${step === i + 1 ? 'bg-steam-accent text-steam-deep' : step > i + 1 ? 'bg-steam-card text-white' : 'bg-steam-panel text-steam-dim'}`}>{i + 1}. {t}</div>)}</div>

      {step === 1 && (
        <Section title="About the game">
          <div className="mb-3 flex gap-4 text-sm">
            <label className="flex items-center gap-2"><input type="radio" checked={s.mode === 'new'} onChange={() => set({ mode: 'new' })} /> New record (incl. pre-release)</label>
            <label className="flex items-center gap-2"><input type="radio" checked={s.mode === 'existing'} onChange={() => set({ mode: 'existing' })} /> Claim a game already imported from Steam</label>
          </div>
          {s.mode === 'existing' ? (
            <Field label="Game" hint="Shows every imported record without a registration, including ones that aren’t public. A real site would verify Steam ownership first (e.g. via Steamworks).">
              <select value={s.existingId} onChange={e => set({ existingId: e.target.value })} className="w-full">
                <option value="">Choose…</option>
                {known.map(g => <option key={g.id} value={g.id}>{g.title} — {g.studio}</option>)}
              </select>
            </Field>
          ) : (
            <div className="grid gap-3 sm:grid-cols-2">
              <Field label="Title"><input className="w-full" value={s.title} onChange={e => set({ title: e.target.value })} /></Field>
              <Field label="Studio"><input className="w-full" value={s.studio} onChange={e => set({ studio: e.target.value })} /></Field>
              <Field label="Tags (comma separated)"><input className="w-full" value={s.tags} onChange={e => set({ tags: e.target.value })} /></Field>
              <Field label="Release status">
                <select className="w-full" value={s.prerelease ? 'pre' : 'rel'} onChange={e => set({ prerelease: e.target.value === 'pre' })}>
                  <option value="pre">Pre-release (no release yet)</option><option value="rel">Released</option>
                </select>
              </Field>
              {!s.prerelease && <Field label="Release date"><input type="date" className="w-full" value={s.releaseDate} onChange={e => set({ releaseDate: e.target.value })} /></Field>}
              <Field label="Steam page URL (optional)"><input className="w-full" value={s.steamUrl} onChange={e => set({ steamUrl: e.target.value })} placeholder="https://store.steampowered.com/app/…" /></Field>
              <Field label="First public showing (teaser, post, trailer)"><input className="w-full" value={s.teaserUrl} onChange={e => set({ teaserUrl: e.target.value })} placeholder="https://…" /></Field>
              <Field label="Date of that showing"><input type="date" className="w-full" value={s.teaserDate} onChange={e => set({ teaserDate: e.target.value })} /></Field>
            </div>
          )}
          <div className="mt-3"><Field label="Contact (name / email)"><input className="w-full" value={s.contact} onChange={e => set({ contact: e.target.value })} /></Field></div>
          <div className="mt-4 text-right"><Btn kind="primary" disabled={s.mode === 'existing' ? !s.existingId : !s.title} onClick={() => setStep(2)}>Next</Btn></div>
        </Section>
      )}

      {step === 2 && (
        <Section title="Evidence">
          <p className="mb-3 text-xs text-steam-dim">Build hashes are computed in your browser. Files never leave your machine in this prototype. Public links (teasers, devlogs) count as independently dated. Hashes, concept art and git history count as self-reported dates.</p>
          {s.evidence.map((e, i) => (
            <div key={i} className="mb-2 grid gap-2 rounded bg-black/20 p-2 sm:grid-cols-[130px_130px_1fr_1fr_auto]">
              <select value={e.type} onChange={x => setEv(i, { type: x.target.value })}>{EVIDENCE_TYPES.map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
              <input type="date" value={e.date} onChange={x => setEv(i, { date: x.target.value })} />
              <input placeholder="Label" value={e.label} onChange={x => setEv(i, { label: x.target.value })} />
              <div className="flex gap-1">
                <input className="min-w-0 flex-1" placeholder="Link, hash or commit" value={e.value} onChange={x => setEv(i, { value: x.target.value })} />
                {(e.type === 'build_hash' || e.type === 'concept_art' || e.type === 'document') && (
                  <label className="cursor-pointer rounded bg-steam-card px-2 py-1 text-xs">hash file<input type="file" className="hidden" onChange={async x => { const f = x.target.files[0]; if (f) setEv(i, { value: await sha256(f), label: e.label || f.name }); }} /></label>
                )}
              </div>
              <button className="text-xs text-rose-300" onClick={() => set({ evidence: s.evidence.filter((_, j) => j !== i) })}>remove</button>
            </div>
          ))}
          <Btn onClick={() => set({ evidence: [...s.evidence, { type: 'git', date: '', label: '', value: '', verifiable: false }] })}>+ Add evidence</Btn>
          <div className="mt-4 flex justify-between"><Btn onClick={() => setStep(1)}>Back</Btn><Btn kind="primary" onClick={() => setStep(3)}>Next</Btn></div>
        </Section>
      )}

      {step === 3 && (
        <Section title="AI usage (developer-stated)">
          <div className="grid gap-x-6 gap-y-1 sm:grid-cols-2">
            {AI_CATS.map(c => (
              <div key={c.key} className="flex items-center justify-between gap-2 text-sm">
                <span>{c.label}</span>
                <select value={s.ai[c.key] || 'none'} onChange={e => set({ ai: { ...s.ai, [c.key]: e.target.value === 'none' ? undefined : e.target.value } })}>
                  <option value="none">None</option><option value="assisted">Assisted (human-edited)</option><option value="generated">Generated</option>
                </select>
              </div>
            ))}
          </div>
          <div className="mt-3"><Field label="Short disclosure statement (shown on the game page)"><textarea className="w-full" rows={2} value={s.aiQuote} onChange={e => set({ aiQuote: e.target.value })} /></Field></div>
          <div className="mt-4 flex justify-between"><Btn onClick={() => setStep(2)}>Back</Btn><Btn kind="primary" onClick={() => setStep(4)}>Next</Btn></div>
        </Section>
      )}

      {step === 4 && (
        <Section title="Review & submit">
          <ul className="space-y-1 text-sm">
            <li><span className="text-steam-dim">Game:</span> {s.mode === 'existing' ? (world.byId[s.existingId] || {}).title : s.title} {s.mode === 'new' && s.prerelease && <span className="ml-1 rounded bg-violet-800 px-1 text-[11px]">pre-release</span>}</li>
            <li><span className="text-steam-dim">Evidence items:</span> {s.evidence.filter(e => e.label || e.value).length + (s.teaserUrl ? 1 : 0)}</li>
            <li><span className="text-steam-dim">Record date:</span> {fmt(date)} (the simulated “today”)</li>
          </ul>
          <p className="mt-3 text-xs text-steam-dim">By submitting you confirm you made this game or hold rights to it. Submitting material that isn’t yours can lead to rejection of the record.</p>
          <div className="mt-4 flex justify-between"><Btn onClick={() => setStep(3)}>Back</Btn><Btn kind="primary" onClick={submit}>Submit registration</Btn></div>
        </Section>
      )}

      {step === 5 && receipt && (
        <Section title="Provenance record created">
          <p className="text-sm">Record <code className="rounded bg-black/40 px-1">{receipt.id}</code> for <b className="text-white">{receipt.title}</b> was filed on <b>{fmt(receipt.filed)}</b> with {receipt.n} evidence items.</p>
          <p className="mt-2 text-sm">Rules engine routing: <StatusPill s={r && r.status} /> {r && r.priority && <span className="text-steam-dim">priority {r.priority}</span>}</p>
          <ul className="mt-1 list-disc pl-5 text-xs text-steam-dim">{r && r.reasons.map((x, i) => <li key={i}>{x}</li>)}</ul>
          <div className="mt-4 flex gap-2"><Btn kind="blue" onClick={() => go('moderation')}>Open moderation queue</Btn><Btn onClick={() => { setS(blank); setStep(1); setReceipt(null); }}>Register another</Btn></div>
        </Section>
      )}
    </div>
  );
}

// ---------- 4. Claim submission ----------
function ClaimForm({ world, results, date, go, setSession, settings, targetId }) {
  const pub = world.games.filter(g => E.PUBLIC.includes(results[g.id].status));
  const blank = { targetId: targetId || '', claimant: '', claimantProject: '', concept: '', sourceLink: '', sourceDate: '', overlaps: [{ text: '', kind: 'distinctive' }], confirm: false };
  const [c, setC] = useState(blank);
  const [done, setDone] = useState(null);
  const set = p => setC({ ...c, ...p });
  const draft = { ...c, id: 'draft', filed: date };
  const bar = c.targetId ? E.claimBar(draft, world, settings) : null;

  const submit = () => {
    const claim = { ...c, id: 'c-s' + Math.random().toString(36).slice(2, 6), filed: date, session: true, overlaps: c.overlaps.filter(o => o.text.trim()) };
    setSession(x => ({ ...x, claims: [...x.claims, claim] }));
    setDone({ claim, bar: E.claimBar(claim, world, settings) });
  };

  if (done) return (
    <div className="mx-auto max-w-2xl">
      <Section title="Claim received">
        <p className="text-sm">Thank you. Your claim about <b className="text-white">{world.byId[done.claim.targetId].title}</b> was recorded on {fmt(done.claim.filed)}.</p>
        {done.bar.ok
          ? <p className="mt-2 text-sm">It meets the evidence bar and has gone to a moderator. Both parties may be contacted. If the claim is upheld, it is published only as a dated timeline.</p>
          : <p className="mt-2 text-sm">It doesn’t yet meet the evidence bar, so the listing is unchanged. You can file again with a dated public source that predates the game and a specific, distinctive overlap.</p>}
        <ul className="mt-2 text-xs">{done.bar.checks.map((k, i) => <li key={i}>{k.ok ? '✓' : '✗'} {k.label}</li>)}</ul>
        <div className="mt-4 flex gap-2"><Btn kind="blue" onClick={() => go('moderation')}>Open moderation (internal)</Btn><Btn onClick={() => { setC(blank); setDone(null); }}>File another</Btn></div>
      </Section>
    </div>
  );

  return (
    <div className="mx-auto grid max-w-5xl gap-5 lg:grid-cols-[1.5fr_1fr]">
      <div className="space-y-4">
        <h1 className="text-2xl font-bold text-white">Submit an idea claim</h1>
        <p className="text-sm text-steam-dim">For when a listed game appears to use a concept you showed publicly first. Claims are reviewed by people. If upheld, Firstmark publishes only a factual, dated timeline. It never publishes a verdict.</p>
        <Section title="The game">
          <Field label="Listed game"><select className="w-full" value={c.targetId} onChange={e => set({ targetId: e.target.value })}><option value="">Choose…</option>{pub.map(g => <option key={g.id} value={g.id}>{g.title} — {g.studio}</option>)}</select></Field>
        </Section>
        <Section title="You and your concept">
          <div className="grid gap-3 sm:grid-cols-2">
            <Field label="Your name"><input className="w-full" value={c.claimant} onChange={e => set({ claimant: e.target.value })} /></Field>
            <Field label="Your project"><input className="w-full" value={c.claimantProject} onChange={e => set({ claimantProject: e.target.value })} /></Field>
          </div>
          <div className="mt-3"><Field label="Describe the concept"><textarea rows={2} className="w-full" value={c.concept} onChange={e => set({ concept: e.target.value })} /></Field></div>
          <div className="mt-3 grid gap-3 sm:grid-cols-[1fr_170px]">
            <Field label="Public source link" hint="A post, video or page that shows the concept and carries a date."><input className="w-full" value={c.sourceLink} onChange={e => set({ sourceLink: e.target.value })} placeholder="https://…" /></Field>
            <Field label="Date of that source"><input type="date" className="w-full" value={c.sourceDate} onChange={e => set({ sourceDate: e.target.value })} /></Field>
          </div>
        </Section>
        <Section title="What overlaps?">
          <p className="mb-2 text-xs text-steam-dim">List concrete elements. Genre and common mechanics (“a roguelike deckbuilder”, “has crafting”) don’t meet the bar on their own.</p>
          {c.overlaps.map((o, i) => (
            <div key={i} className="mb-2 flex gap-2">
              <input className="flex-1" value={o.text} onChange={e => set({ overlaps: c.overlaps.map((x, j) => (j === i ? { ...x, text: e.target.value } : x)) })} placeholder="e.g. letters are burned as fuel for the cart" />
              <select value={o.kind} onChange={e => set({ overlaps: c.overlaps.map((x, j) => (j === i ? { ...x, kind: e.target.value } : x)) })}>
                <option value="distinctive">Specific & distinctive</option><option value="genre">Genre / common mechanic</option>
              </select>
            </div>
          ))}
          <Btn onClick={() => set({ overlaps: [...c.overlaps, { text: '', kind: 'distinctive' }] })}>+ Add overlap</Btn>
        </Section>
        <label className="flex items-start gap-2 text-sm"><input type="checkbox" className="mt-1" checked={c.confirm} onChange={e => set({ confirm: e.target.checked })} /> I understand the developer of this game may be shown my claim and given a chance to respond.</label>
        <Btn kind="primary" disabled={!c.targetId || !c.claimant || !c.confirm} onClick={submit}>Submit claim</Btn>
      </div>
      <div className="lg:pt-12">
        <Section title="Evidence bar (live)">
          {!bar ? <p className="text-sm text-steam-dim">Choose a game to see the checks.</p> : (
            <>
              <ul className="space-y-2 text-sm">{bar.checks.map((k, i) => <li key={i} className="flex gap-2"><span className={k.ok ? 'text-emerald-400' : 'text-amber-400'}>{k.ok ? '✓' : '✗'}</span><span>{k.label}</span></li>)}</ul>
              <div className={`mt-3 rounded p-2 text-sm ${bar.ok ? 'bg-emerald-900/40 text-emerald-200' : 'bg-amber-900/30 text-amber-200'}`}>
                {bar.ok ? 'Meets the bar: will go to a moderator.' : 'Below the bar: will be recorded, but the listing stays unchanged.'}
              </div>
            </>
          )}
        </Section>
      </div>
    </div>
  );
}

// ---------- 5. Moderation ----------
const ACTIONS = {
  registration: { approve: 'Approve → grant Verified Provenance', reject: 'Reject registration (record hidden; developer may appeal)' },
  asset: { approve: 'Approve → match is legitimate (e.g. shared pack); resume normal rules', reject: 'Reject record (internal reason required)' },
  claim: { approve: 'Approve → uphold claim; publish the dated idea timeline', reject: 'Reject → dismiss claim; nothing is published' },
  appeal: { approve: 'Approve → accept appeal; lift prior decision', reject: 'Reject → deny appeal; record stays hidden' },
};

function Moderation(props) {
  const { world, results, date, settings, setSettings } = props;
  const [tab, setTab] = useState('queue');
  const of = s => world.games.filter(g => results[g.id].status === s);
  const queue = of('QUEUED').sort((a, b) => results[b.id].priority - results[a.id].priority || (results[a.id].since < results[b.id].since ? -1 : 1));
  const ws = E.weekStart(date);
  const used = world.log.filter(e => e.date >= ws && e.date <= date && ['approve', 'reject', 'clear', 'request_info'].includes(e.action)).length;
  const cap = settings.WEEKLY_CAPACITY;
  const appeals = world.appeals.filter(a => a.filed <= date);
  const claims = world.claims.filter(c => c.filed <= date);
  const tabs = [
    ['queue', `Queue (${queue.length})`], ['held', `Held (${of('HELD').length})`], ['nye', `Not yet eligible (${of('NOT_YET_ELIGIBLE').length})`],
    ['rejected', `Rejected (${of('REJECTED').length})`], ['appeals', `Appeals (${appeals.length})`], ['claims', `Claims (${claims.length})`], ['log', 'Decision log'],
  ];
  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 className="text-2xl font-bold text-white">Moderation</h1>
          <p className="text-sm text-steam-dim">Automation collects facts and routes records. Only people make decisions here.</p>
        </div>
        <div className="w-72 rounded bg-steam-panel p-3 text-xs ring-1 ring-black/30">
          <div className="mb-1 flex justify-between"><span className="text-steam-dim">Weekly capacity (week of {fmt(ws)})</span><span className={used >= cap ? 'text-rose-300' : 'text-white'}>{used} / {cap}</span></div>
          <div className="h-2 overflow-hidden rounded bg-black/40"><div className={`h-full ${used >= cap ? 'bg-rose-500' : 'bg-steam-accent'}`} style={{ width: `${Math.min(100, (used / cap) * 100)}%` }} /></div>
          <div className="mt-2 flex items-center justify-between gap-2">
            <span className="text-steam-dim">Cap</span>
            <input type="number" min={1} value={cap} onChange={e => setSettings({ ...settings, WEEKLY_CAPACITY: Math.max(1, +e.target.value) })} className="w-16" />
          </div>
          {queue.length > cap - used && <div className="mt-1 text-amber-300">Queue ({queue.length}) exceeds remaining capacity ({Math.max(0, cap - used)}).</div>}
        </div>
      </div>
      <div className="flex flex-wrap gap-1 border-b border-steam-line">
        {tabs.map(([k, l]) => <button key={k} onClick={() => setTab(k)} className={`rounded-t px-3 py-1.5 text-sm ${tab === k ? 'bg-steam-panel text-white' : 'text-steam-dim hover:text-white'}`}>{l}</button>)}
      </div>
      {tab === 'queue' && (queue.length ? queue.map((g, i) => <QueueItem key={g.id} g={g} rank={i} {...props} />) : <Empty>Nothing is waiting for a decision.</Empty>)}
      {tab === 'held' && <HeldList list={of('HELD')} {...props} />}
      {tab === 'nye' && <NyeList list={of('NOT_YET_ELIGIBLE')} {...props} />}
      {tab === 'rejected' && <RejectedList list={of('REJECTED')} {...props} />}
      {tab === 'appeals' && <AppealsList appeals={appeals} {...props} />}
      {tab === 'claims' && <ClaimsList claims={claims} {...props} />}
      {tab === 'log' && <LogList {...props} />}
    </div>
  );
}
const Empty = ({ children }) => <div className="rounded bg-steam-panel p-6 text-sm text-steam-dim">{children}</div>;

function RowHead({ g, r, go, right, onToggle }) {
  return (
    <div className="flex cursor-pointer flex-wrap items-center gap-3 p-3" onClick={onToggle}>
      <Capsule g={g} className="h-11 w-24 shrink-0" label={false} />
      <div className="min-w-0 flex-1">
        <div className="font-semibold text-white">{g.title} <span className="font-normal text-steam-dim">· {g.studio}</span> {g.case && <span className="ml-1 rounded bg-black/40 px-1 text-[10px] text-steam-dim">case {g.case}</span>}</div>
        <div className="mt-0.5 text-xs text-steam-dim">{r.reasons.join(' · ')}</div>
      </div>
      {right}
      <button className="text-xs text-steam-accent hover:underline" onClick={e => { e.stopPropagation(); go('game', { id: g.id, internal: true }); }}>preview page</button>
    </div>
  );
}

function QueueItem(props) {
  const { g, results, date, rank, go } = props;
  const r = results[g.id];
  const [open, setOpen] = useState(rank < 1);
  return (
    <div className="rounded bg-steam-panel ring-1 ring-black/40">
      <div className="flex items-center">
        <div className="w-16 shrink-0 text-center"><div className="text-2xl font-black text-violet-300">{r.priority}</div><div className="text-[9px] uppercase text-steam-dim">priority</div></div>
        <div className="flex-1">
          <RowHead g={g} r={r} go={go} onToggle={() => setOpen(!open)}
            right={<div className="text-right text-xs text-steam-dim">waiting since {fmt(r.since)}<br />{E.daysBetween(r.since, date)} days</div>} />
        </div>
      </div>
      {open && (
        <div className="space-y-4 border-t border-steam-line p-4">
          <EvidenceSummary {...props} r={r} />
          {r.triggers.map(t => <TriggerActions key={t.id} t={t} {...props} />)}
        </div>
      )}
    </div>
  );
}

function TriggerActions({ t, g, world, date, act, settings }) {
  const [note, setNote] = useState('');
  const idx = E.decisionIndex(world, date);
  const ann = E.annotations(idx, t.id);
  const help = ACTIONS[t.type];
  let accused = [];
  if (t.type === 'asset' || t.type === 'claim') accused = [g.studio];
  if (t.type === 'registration') accused = world.similarity.filter(p => (p.a === g.id || p.b === g.id)).map(p => world.byId[p.a === g.id ? p.b : p.a]).filter(o => o && E.isKnown(o, date)).map(o => o.studio);
  return (
    <div className="rounded border border-violet-500/30 bg-violet-950/20 p-3">
      <div className="mb-2 flex flex-wrap items-center gap-2 text-sm"><span className="rounded bg-violet-800 px-1.5 text-xs text-white">{t.type}</span><b className="text-white">{t.label}</b><span className="text-xs text-steam-dim">priority {t.priority} · since {fmt(t.since)}</span></div>
      {ann.length > 0 && (
        <ul className="mb-2 text-xs text-steam-dim">
          {ann.map((a, i) => <li key={i}>• {fmt(a.date)} — {a.action === 'notify' ? `Right of response sent; reply due ${fmt(E.addDays(a.date, settings.RESPONSE_WINDOW_DAYS))}` : 'More info requested'} {a.note && `(${a.note})`} <span className="opacity-60">— {a.by}</span></li>)}
        </ul>
      )}
      <ul className="mb-2 text-xs text-steam-dim"><li>Approve: {help.approve.replace(/^Approve → /, '')}</li><li>Reject: {help.reject.replace(/^Reject → /, '')}</li></ul>
      <div className="flex flex-wrap items-center gap-2">
        <input className="min-w-[220px] flex-1 text-sm" placeholder="Note / internal reason (stored, never shown publicly)" value={note} onChange={e => setNote(e.target.value)} />
        <Btn kind="primary" onClick={() => act(t.id, 'approve', { note })}>Approve</Btn>
        <Btn kind="danger" disabled={!note.trim()} title="An internal reason is required" onClick={() => act(t.id, 'reject', { note, internalReason: note })}>Reject</Btn>
        <Btn kind="warn" onClick={() => act(t.id, 'request_info', { note })}>Request info</Btn>
        <Btn kind="blue" disabled={!accused.length} onClick={() => act(t.id, 'notify', { note: `Notified ${accused.join(', ')}` })}>Notify accused</Btn>
      </div>
      {accused.length > 0 && <div className="mt-1 text-[11px] text-steam-dim">Right of response would go to: {accused.join(', ')}</div>}
    </div>
  );
}

function EvidenceSummary({ g, r, world, results, date, settings }) {
  const PARTY_COLORS = ['#66c0f4', '#f0abfc', '#fcd34d', '#86efac'];
  const partyIds = [g.id, ...r.similar.filter(p => p.score >= 0.5).map(p => p.other)];
  if (g.assetMatch) partyIds.push(g.assetMatch.against);
  const uniq = [...new Set(partyIds)].slice(0, 4);
  const parties = uniq.map((id, i) => ({ key: id, name: world.byId[id].title + (id === g.id ? ' (this record)' : ''), color: PARTY_COLORS[i], events: E.partyEvents(world.byId[id]) }));
  const claims = world.claims.filter(c => c.targetId === g.id && c.filed <= date);
  claims.forEach((c, i) => parties.push({ key: c.id, name: `${c.claimant} (claimant)`, color: '#fb923c', events: [{ date: c.sourceDate, text: 'Concept shown publicly (source link)', kind: 'public' }, { date: c.filed, text: 'Idea claim filed', kind: 'system' }] }));
  const quoted = [
    ...(g.reviewSamples || []).filter(rv => rv.signal === 'copy').map(rv => ({ ...rv, on: g.title })),
    ...world.games.filter(h => (h.namesOriginal || []).some(n => n.id === g.id && n.from <= date)).flatMap(h => (h.reviewSamples || []).filter(rv => rv.signal === 'copy').map(rv => ({ ...rv, on: h.title }))),
  ];
  const myIndep = E.earliestIndependent(g) || (g.registration && g.registration.filed);
  const earlier = r.similar.filter(p => p.score >= settings.SIMILARITY_THRESHOLD).map(p => world.byId[p.other]).filter(o => { const d = E.earliestPublic(o); return d && myIndep && d < myIndep; });

  return (
    <div className="space-y-4">
      {earlier.map(o => (
        <div key={o.id} className="rounded border border-sky-400/40 bg-sky-950/40 p-2 text-sm text-sky-100">
          “{o.title}” ({o.studio}) has a public record dated <b>{fmt(E.earliestPublic(o))}</b>, earlier than this record’s earliest independently dated evidence ({fmt(myIndep)}). The material overlaps (similarity {r.similar.find(p => p.other === o.id).score.toFixed(2)}).
        </div>
      ))}
      <div className="grid gap-4 xl:grid-cols-[1.4fr_1fr]">
        <div>
          <h4 className="mb-1 text-xs font-bold uppercase tracking-widest text-steam-dim">Side-by-side timelines</h4>
          <SideBySide parties={parties} date={date} />
          <div className="mt-1 text-[10px] text-steam-dim">Blue = public & independently dated · amber = self-reported date · grey = system event</div>
        </div>
        <div className="space-y-3">
          {r.checks && <MiniChecks checks={r.checks} />}
          {r.notes.length > 0 && <ul className="list-disc pl-4 text-xs text-steam-dim">{r.notes.map((n, i) => <li key={i}>{n}</li>)}</ul>}
        </div>
      </div>

      {r.similar.length > 0 && (
        <div>
          <h4 className="mb-1 text-xs font-bold uppercase tracking-widest text-steam-dim">Similarity scores</h4>
          <table className="w-full text-xs">
            <thead className="text-steam-dim"><tr><th className="text-left">Other record</th><th>Title</th><th>Description</th><th>Screenshots</th><th>Keywords</th><th>Max</th><th>Counts?</th></tr></thead>
            <tbody>{r.similar.map(p => (
              <tr key={p.other} className="border-t border-steam-line/40 text-center">
                <td className="py-1 text-left text-white">{world.byId[p.other].title} <StatusPill s={results[p.other].status} /></td>
                {['title', 'description', 'screenshots', 'keywords'].map(k => <td key={k} className={p[k] >= settings.SIMILARITY_THRESHOLD ? 'font-bold text-amber-300' : ''}>{p[k].toFixed(2)}</td>)}
                <td className="font-bold">{p.score.toFixed(2)}</td>
                <td className="text-[10px] text-steam-dim">{p.otherInR ? 'listed/registered' : 'no (partner not listed/registered)'}</td>
              </tr>
            ))}</tbody>
          </table>
          <div className="mt-3 flex flex-wrap gap-4">
            {r.similar.filter(p => p.screenshots >= 0.5).map(p => {
              const o = world.byId[p.other];
              return (
                <div key={p.other} className="text-xs">
                  <div className="flex gap-1"><Capsule g={g} className="h-14 w-24" label={false} /><Capsule g={o} className="h-14 w-24" label={false} /></div>
                  <div className="mt-1 text-steam-dim">Matched screenshots: {g.title} ↔ {o.title} · <b className="text-white">{p.screenshots.toFixed(2)}</b></div>
                  {p.note && <div className="text-steam-dim">{p.note}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {g.assetMatch && g.assetMatch.detected <= date && (
        <div className="rounded bg-black/20 p-3 text-sm">
          <h4 className="mb-1 text-xs font-bold uppercase tracking-widest text-steam-dim">Asset / code match vs registered build of “{world.byId[g.assetMatch.against].title}” · score {g.assetMatch.score.toFixed(2)}</h4>
          <ul className="list-disc pl-5 text-xs">{g.assetMatch.details.map((d, i) => <li key={i}>{d}</li>)}</ul>
          {g.assetMatch.sharedPack && <div className="mt-2 rounded bg-emerald-900/30 p-2 text-xs text-emerald-200">Shared-pack check: all matched assets also appear in “{g.assetMatch.sharedPack.name}” ({g.assetMatch.sharedPack.vendor}, published {fmt(g.assetMatch.sharedPack.published)}). Likely legitimate.</div>}
          {!g.assetMatch.sharedPack && <div className="mt-2 text-xs text-steam-dim">Shared-pack check: no matching public asset-store pack or engine template found.</div>}
        </div>
      )}

      {g.registration && g.registration.filed <= date && (
        <div>
          <h4 className="mb-1 text-xs font-bold uppercase tracking-widest text-steam-dim">Registration evidence ({g.registration.by}, filed {fmt(g.registration.filed)}){E.isPrerelease(g) && ' · pre-release'}</h4>
          <table className="w-full text-xs"><tbody>{g.registration.evidence.map((e, i) => (
            <tr key={i} className="border-t border-steam-line/40"><td className="py-1 pr-2 text-steam-dim">{fmt(e.date)}</td><td className="pr-2">{E.EVIDENCE_LABEL[e.type]}</td><td className="pr-2 text-white">{e.label}</td><td className="font-mono text-[10px] text-steam-dim">{e.value}</td><td className={e.verifiable ? 'text-sky-300' : 'text-amber-300'}>{e.verifiable ? 'independently dated' : 'self-reported date'}</td></tr>
          ))}</tbody></table>
        </div>
      )}

      {claims.map(c => { const bar = E.claimBar(c, world, settings); return (
        <div key={c.id} className="rounded border border-orange-400/30 bg-orange-950/20 p-3 text-sm">
          <h4 className="mb-1 text-xs font-bold uppercase tracking-widest text-orange-300">Idea claim {c.id} · {c.claimant} · {c.claimantProject}</h4>
          <p className="text-xs">{c.concept}</p>
          <p className="mt-1 text-xs">Source: <MockLink href={c.sourceLink} className="text-steam-accent">{c.sourceLink}</MockLink> dated {fmt(c.sourceDate)}</p>
          <ul className="mt-1 text-xs">{c.overlaps.map((o, i) => <li key={i}>{o.kind === 'distinctive' ? '◆' : '○'} {o.text} <span className="text-steam-dim">({o.kind})</span></li>)}</ul>
          <ul className="mt-2 text-xs">{bar.checks.map((k, i) => <li key={i}>{k.ok ? '✓' : '✗'} {k.label}</li>)}</ul>
        </div>
      ); })}

      {quoted.length > 0 && (
        <div>
          <h4 className="mb-1 text-xs font-bold uppercase tracking-widest text-steam-dim">Reviews flagged by the copy-signal detector (quoted, unverified)</h4>
          {quoted.map((q, i) => <blockquote key={i} className="mb-1 border-l-2 border-amber-500/50 pl-2 text-xs"><span className="text-steam-dim">on {q.on} · {q.author}:</span> “{q.text}”</blockquote>)}
        </div>
      )}
    </div>
  );
}

function SideBySide({ parties, date }) {
  const dates = [...new Set(parties.flatMap(p => p.events.map(e => e.date)))].filter(d => d && d <= date).sort();
  const cls = { public: 'text-sky-200', self: 'text-amber-200', system: 'text-steam-dim' };
  return (
    <div className="overflow-x-auto rounded bg-black/20">
      <table className="w-full text-xs">
        <thead><tr><th className="w-24 p-1.5 text-left text-steam-dim">Date</th>{parties.map(p => <th key={p.key} className="p-1.5 text-left" style={{ color: p.color }}>{p.name}</th>)}</tr></thead>
        <tbody>{dates.map(d => (
          <tr key={d} className="border-t border-steam-line/40">
            <td className="whitespace-nowrap p-1.5 text-steam-dim">{fmt(d)}</td>
            {parties.map(p => <td key={p.key} className="p-1.5 align-top">{p.events.filter(e => e.date === d).map((e, i) => <div key={i} className={cls[e.kind]}>{e.text}</div>)}</td>)}
          </tr>
        ))}</tbody>
      </table>
    </div>
  );
}
function MiniChecks({ checks }) {
  return (
    <table className="w-full text-xs"><tbody>{Object.values(checks).map(c => (
      <tr key={c.label} className="border-t border-steam-line/40"><td className="py-0.5 pr-1">{c.ok ? <span className="text-emerald-400">✓</span> : <span className="text-amber-400">✗</span>}</td><td className="pr-2 text-steam-dim">{c.label}</td><td className="text-right">{String(c.value)}</td></tr>
    ))}</tbody></table>
  );
}

function HeldList({ list, results, go, act, ...rest }) {
  if (!list.length) return <Empty>No held records.</Empty>;
  return (
    <div className="space-y-2">
      <p className="text-xs text-steam-dim">Held records are hidden and silent. Nobody is waiting on them, so they need no action. You can open one, or clear its signals to let the normal rules list it.</p>
      {list.map(g => <HeldRow key={g.id} g={g} r={results[g.id]} results={results} go={go} act={act} {...rest} />)}
    </div>
  );
}
function HeldRow(props) {
  const { g, r, go, act } = props;
  const [open, setOpen] = useState(false);
  const [note, setNote] = useState('');
  return (
    <div className="rounded bg-steam-panel ring-1 ring-black/40">
      <RowHead g={g} r={r} go={go} onToggle={() => setOpen(!open)} right={<StatusPill s="HELD" />} />
      {open && (
        <div className="space-y-3 border-t border-steam-line p-4">
          <EvidenceSummary {...props} />
          <div className="flex gap-2"><input className="flex-1 text-sm" placeholder="Note (internal)" value={note} onChange={e => setNote(e.target.value)} /><Btn kind="warn" onClick={() => act('held:' + g.id, 'clear', { note })}>Clear signals</Btn></div>
        </div>
      )}
    </div>
  );
}
function NyeList({ list, results, go }) {
  if (!list.length) return <Empty>No records waiting on age or reviews.</Empty>;
  return <div className="space-y-2"><p className="text-xs text-steam-dim">Re-checked automatically every day. Nothing for moderators to do.</p>{list.map(g => <div key={g.id} className="rounded bg-steam-panel ring-1 ring-black/40"><RowHead g={g} r={results[g.id]} go={go} right={<StatusPill s="NOT_YET_ELIGIBLE" />} /></div>)}</div>;
}
function RejectedList({ list, results, go, date, setSession }) {
  const [appealFor, setAppealFor] = useState(null);
  const [text, setText] = useState('');
  if (!list.length) return <Empty>No rejected records.</Empty>;
  const fileAppeal = g => {
    const ev = text.split('\n').map(x => x.trim()).filter(Boolean);
    setSession(s => ({ ...s, appeals: [...s.appeals, { id: 'ap-s' + Math.random().toString(36).slice(2, 6), gameId: g.id, filed: date, statement: 'Filed from the moderation panel (simulated developer).', newEvidence: ev, session: true }] }));
    setAppealFor(null); setText('');
  };
  return (
    <div className="space-y-2">
      <p className="text-xs text-steam-dim">Internal reasons are never shown publicly. Moderator rejections can be appealed. Automatic, non-accusatory rejections (removed, not a game, duplicate) are listed for completeness.</p>
      {list.map(g => { const r = results[g.id]; return (
        <div key={g.id} className="rounded bg-steam-panel ring-1 ring-black/40">
          <RowHead g={g} r={r} go={go} right={<StatusPill s="REJECTED" />} />
          <div className="border-t border-steam-line px-3 py-2 text-xs">
            {r.internalReason && <div><span className="text-rose-300">Internal reason:</span> {r.internalReason}</div>}
            {r.notes.map((n, i) => <div key={i} className="text-steam-dim">{n}</div>)}
            {appealFor === g.id ? (
              <div className="mt-2 space-y-2">
                <textarea rows={2} className="w-full" placeholder="New evidence, one item per line (leave empty to test an appeal without new evidence)" value={text} onChange={e => setText(e.target.value)} />
                <div className="flex gap-2"><Btn kind="blue" onClick={() => fileAppeal(g)}>File appeal as developer</Btn><Btn onClick={() => setAppealFor(null)}>Cancel</Btn></div>
              </div>
            ) : <button className="mt-1 text-steam-accent hover:underline" onClick={() => setAppealFor(g.id)}>Simulate a developer appeal…</button>}
          </div>
        </div>
      ); })}
    </div>
  );
}
function AppealsList({ appeals, world, results, date, go }) {
  if (!appeals.length) return <Empty>No appeals yet.</Empty>;
  const idx = E.decisionIndex(world, date);
  return (
    <div className="space-y-2">{appeals.map(a => {
      const g = world.byId[a.gameId], d = E.finalDecision(idx, 'appeal:' + a.id);
      const state = d ? (d.action === 'approve' ? 'accepted' : 'denied') : results[g.id].triggers.some(t => t.id === 'appeal:' + a.id) ? 'in queue' : 'closed (no new evidence)';
      return (
        <div key={a.id} className="rounded bg-steam-panel p-3 text-sm ring-1 ring-black/40">
          <div className="flex flex-wrap items-center gap-2"><b className="text-white">{g.title}</b><span className="text-xs text-steam-dim">filed {fmt(a.filed)}</span><span className="rounded bg-black/40 px-1.5 text-xs">{state}</span><StatusPill s={results[g.id].status} /><button className="ml-auto text-xs text-steam-accent" onClick={() => go('game', { id: g.id, internal: true })}>preview</button></div>
          <p className="mt-1 text-xs">{a.statement}</p>
          <ul className="mt-1 list-disc pl-5 text-xs text-steam-dim">{a.newEvidence.length ? a.newEvidence.map((e, i) => <li key={i}>{e}</li>) : <li>No new evidence</li>}</ul>
        </div>
      );
    })}</div>
  );
}
function ClaimsList({ claims, world, results, date, settings, go }) {
  const idx = E.decisionIndex(world, date);
  if (!claims.length) return <Empty>No claims yet.</Empty>;
  return (
    <div className="space-y-2">{claims.map(c => {
      const bar = E.claimBar(c, world, settings), d = E.finalDecision(idx, 'claim:' + c.id), t = world.byId[c.targetId];
      const state = d ? (d.action === 'approve' ? 'upheld — timeline published' : 'dismissed') : bar.ok ? 'meets bar — in queue' : 'below evidence bar — no effect';
      return (
        <div key={c.id} className="rounded bg-steam-panel p-3 text-sm ring-1 ring-black/40">
          <div className="flex flex-wrap items-center gap-2"><b className="text-white">{c.claimant}</b><span className="text-steam-dim">→</span><b className="text-white">{t.title}</b><StatusPill s={results[t.id].status} /><span className="text-xs text-steam-dim">filed {fmt(c.filed)}</span><span className={`rounded px-1.5 text-xs ${bar.ok ? 'bg-emerald-900/50' : 'bg-black/40'}`}>{state}</span></div>
          <ul className="mt-1 text-xs">{bar.checks.map((k, i) => <li key={i}>{k.ok ? '✓' : '✗'} {k.label}</li>)}</ul>
        </div>
      );
    })}</div>
  );
}
function LogList({ world, date }) {
  const entries = world.log.filter(e => e.date <= date).slice().reverse();
  return (
    <table className="w-full text-xs"><thead className="text-steam-dim"><tr><th className="text-left">Date</th><th className="text-left">Trigger</th><th className="text-left">Action</th><th className="text-left">By</th><th className="text-left">Note / internal reason</th></tr></thead>
      <tbody>{entries.map((e, i) => (
        <tr key={i} className="border-t border-steam-line/40"><td className="py-1 pr-2">{fmt(e.date)}</td><td className="pr-2 font-mono">{e.triggerId}</td><td className="pr-2">{e.action}</td><td className="pr-2">{e.by}{e.scripted ? '' : ' ★'}</td><td>{e.internalReason || e.note}</td></tr>
      ))}</tbody></table>
  );
}

// ---------- 6. Settings ----------
const SETTING_DEFS = [
  ['Eligibility', [
    ['MIN_DAYS_RELEASED', 'Minimum days since release', 'number', 0, 365, 1],
    ['MIN_REVIEWS', 'Minimum review count', 'number', 0, 2000, 1],
  ]],
  ['Signals', [
    ['COPY_SIGNAL_THRESHOLD', 'Review copy-signal threshold (HELD at or above)', 'range', 0, 1, 0.01],
    ['SIMILARITY_THRESHOLD', 'Similarity collision threshold', 'range', 0, 1, 0.01],
    ['NAMED_AS_ORIGINAL_CHECK', 'Block auto-listing when a game is named as the original on another game’s page', 'bool'],
    ['CLAIM_REQUIRES_DISTINCTIVE_OVERLAP', 'Claims must name a specific, distinctive overlap', 'bool'],
  ]],
  ['Queue priority', [
    ['PRIORITY_ASSET_MATCH', 'Asset/code match vs registered build', 'number', 0, 200, 1],
    ['PRIORITY_PRERELEASE_REGISTRATION', 'Pre-release registration', 'number', 0, 200, 1],
    ['PRIORITY_CLAIM', 'Idea claim meeting the bar', 'number', 0, 200, 1],
    ['PRIORITY_APPEAL', 'Appeal', 'number', 0, 200, 1],
    ['PRIORITY_REGISTRATION', 'Registration of a released game', 'number', 0, 200, 1],
    ['PRIORITY_BOOST_LIVE_LOOKALIKE', 'Boost: similar game already live on Steam', 'number', 0, 50, 1],
  ]],
  ['Moderation', [
    ['WEEKLY_CAPACITY', 'Weekly decision capacity', 'number', 1, 500, 1],
    ['RESPONSE_WINDOW_DAYS', 'Right-of-response window (days)', 'number', 1, 60, 1],
  ]],
];
function SettingsPanel({ settings, setSettings, tests, go }) {
  const set = (k, v) => setSettings({ ...settings, [k]: v });
  const fails = tests.filter(t => !t.pass && !t.overridden).length, worst = tests.filter(t => t.worst).length;
  return (
    <div className="mx-auto max-w-3xl space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <h1 className="text-2xl font-bold text-white">Rules engine settings</h1>
        <div className="flex items-center gap-2 text-sm">
          <span className={worst ? 'text-rose-300' : fails ? 'text-amber-300' : 'text-emerald-300'}>{worst ? `${worst} worst-case` : ''} {fails} failing / {tests.length} tests</span>
          <Btn onClick={() => go('tests')}>Open tests</Btn>
          <Btn onClick={() => setSettings({ ...M.settings })}>Reset defaults</Btn>
        </div>
      </div>
      <p className="text-sm text-steam-dim">Every change re-runs the engine on every record immediately. Changed values are highlighted.</p>
      {SETTING_DEFS.map(([group, defs]) => (
        <Section key={group} title={group}>
          <div className="space-y-3">{defs.map(([k, label, type, min, max, step]) => {
            const changed = settings[k] !== M.settings[k];
            return (
              <div key={k} className={`grid items-center gap-2 sm:grid-cols-[1fr_260px] ${changed ? 'rounded bg-amber-900/20 px-2 py-1' : ''}`}>
                <div><div className="text-sm text-white">{label}</div><div className="font-mono text-[10px] text-steam-dim">{k} · default {String(M.settings[k])}</div></div>
                {type === 'bool' ? <input type="checkbox" checked={settings[k]} onChange={e => set(k, e.target.checked)} className="justify-self-start" />
                  : type === 'range' ? <div className="flex items-center gap-2"><input type="range" min={min} max={max} step={step} value={settings[k]} onChange={e => set(k, +e.target.value)} className="flex-1" /><input type="number" min={min} max={max} step={step} value={settings[k]} onChange={e => set(k, +e.target.value)} className="w-20" /></div>
                  : <input type="number" min={min} max={max} step={step} value={settings[k]} onChange={e => set(k, +e.target.value)} className="w-28" />}
              </div>
            );
          })}</div>
        </Section>
      ))}
    </div>
  );
}

// ---------- 8. Tests ----------
function TestsPanel({ tests, world, date, settings, delta, go }) {
  const [sweep, setSweep] = useState(null);
  const claimTests = E.claimTests(world, settings);
  const fails = tests.filter(t => !t.pass && !t.overridden), worst = tests.filter(t => t.worst);
  const runSweep = () => { const t0 = performance.now(); const runs = E.sweep(world, settings); setSweep({ runs, ms: performance.now() - t0, settings: JSON.stringify(settings) }); };
  const stale = sweep && sweep.settings !== JSON.stringify(settings);
  const TRUTH = { original: 'original', 'non-original': 'non-original', parallel: 'parallel dev', 'idea-overlap': 'idea overlap', 'n/a': 'n/a', unknown: 'unknown' };
  const flips = Object.entries(delta.tests || {});
  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 className="text-2xl font-bold text-white">Test cases at {fmt(date)}</h1>
          <p className="text-sm text-steam-dim">Expected status comes from the scripted timeline in MOCK_DATA. Worst case = a non-original record ends up LISTED or VERIFIED.</p>
        </div>
        <div className="flex gap-3 text-sm">
          <span className="rounded bg-emerald-900/40 px-2 py-1">{tests.filter(t => t.pass).length} pass</span>
          <span className={`rounded px-2 py-1 ${fails.length ? 'bg-amber-700/60 text-white' : 'bg-black/30'}`}>{fails.length} fail</span>
          <span className={`rounded px-2 py-1 ${worst.length ? 'bg-rose-600 text-white' : 'bg-black/30'}`}>{worst.length} worst-case</span>
        </div>
      </div>
      {flips.length > 0 && (
        <div className="rounded border border-amber-500/40 bg-amber-950/30 p-2 text-sm">
          After the last {delta.cause}: {flips.map(([id, k]) => <span key={id} className={`mr-3 ${k === 'broke' ? 'text-amber-300' : 'text-emerald-300'}`}>{world.byId[id].title} {k === 'broke' ? 'now FAILS' : 'now passes'}</span>)}
        </div>
      )}
      <div className="overflow-x-auto rounded bg-steam-panel ring-1 ring-black/40">
        <table className="w-full text-xs">
          <thead className="bg-black/30 text-steam-dim"><tr><th className="p-2 text-left">Case</th><th className="p-2 text-left">Record</th><th className="p-2 text-left">Truth</th><th className="p-2">Expected</th><th className="p-2">Actual</th><th className="p-2">Result</th><th className="p-2 text-left">Engine reasons</th></tr></thead>
          <tbody>{tests.map(t => {
            const flip = delta.tests && delta.tests[t.id];
            const rowCls = t.worst ? 'bg-rose-900/50' : t.overridden ? 'opacity-60' : !t.pass ? 'bg-amber-900/30' : '';
            return (
              <tr key={t.id + (flip ? delta.at : '')} className={`border-t border-steam-line/40 ${rowCls} ${flip === 'broke' ? 'flash' : ''}`}>
                <td className="p-2 font-mono">{t.case}</td>
                <td className="p-2"><button className="font-semibold text-white hover:text-steam-accent" onClick={() => go('game', { id: t.id, internal: true })}>{t.title}</button><div className="text-steam-dim">{t.scenario}</div></td>
                <td className="p-2">{TRUTH[t.truth]}</td>
                <td className="p-2 text-center"><StatusPill s={t.expected} /></td>
                <td className="p-2 text-center"><StatusPill s={t.actual} /></td>
                <td className="p-2 text-center font-bold">
                  {t.worst ? <span className="text-rose-300">WORST CASE</span> : t.overridden ? <span className="font-normal text-steam-dim">overridden by session action</span> : t.pass ? <span className="text-emerald-400">PASS</span> : <span className="text-amber-300">FAIL</span>}
                </td>
                <td className="p-2 text-steam-dim">{t.reasons.join(' · ')}</td>
              </tr>
            );
          })}</tbody>
        </table>
      </div>

      <Section title="Claim evidence-bar tests">
        <table className="w-full text-xs"><tbody>{claimTests.map(t => (
          <tr key={t.id} className="border-t border-steam-line/40"><td className="py-1 font-mono">{t.case}</td><td>{t.claimant} → {t.target}</td><td>expected {t.expected ? 'meets bar' : 'below bar'}</td><td>actual {t.actual ? 'meets bar' : 'below bar'}</td><td className={t.pass ? 'text-emerald-400' : 'text-amber-300'}>{t.pass ? 'PASS' : 'FAIL'}</td></tr>
        ))}</tbody></table>
      </Section>

      <Section title="Whole-timeline sweep" right={<Btn kind="blue" onClick={runSweep}>Run every day {fmt(M.simulation.start)} → {fmt(M.simulation.end)}</Btn>}>
        {!sweep ? <p className="text-sm text-steam-dim">Runs the engine for every simulated day with the current settings and lists every failing or worst-case window.</p> : (
          <div>
            <p className={`mb-2 text-xs ${stale ? 'text-amber-300' : 'text-steam-dim'}`}>{stale ? 'Settings changed since this sweep. Run it again. ' : ''}{sweep.runs.length} problem windows · {sweep.ms.toFixed(0)} ms</p>
            {sweep.runs.length === 0 ? <p className="text-sm text-emerald-300">Every test passes on every day.</p> : (
              <table className="w-full text-xs"><tbody>{sweep.runs.map((w, i) => (
                <tr key={i} className={`border-t border-steam-line/40 ${w.worst ? 'bg-rose-900/40' : ''}`}>
                  <td className="py-1 pr-2 font-mono">{w.case}</td><td className="pr-2 text-white">{w.title}</td><td className="pr-2">{fmt(w.from)} → {fmt(w.to)}</td>
                  <td className="pr-2">expected <StatusPill s={w.expected} /> actual <StatusPill s={w.actual} /></td>
                  <td className="font-bold">{w.worst ? <span className="text-rose-300">WORST CASE</span> : <span className="text-amber-300">FAIL</span>}</td>
                </tr>
              ))}</tbody></table>
            )}
          </div>
        )}
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
